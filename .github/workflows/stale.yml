name: Follow up inactive issues

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: -1
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-message: 'This issue has had no activity for 60 days. If you can, share whether the problem still occurs on the latest release or add details about your use case. It will remain open for maintainer review; inactivity alone will not close it.'
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security,bug'
